site_name: Peripatetika
site_url: https://peripatetika.com/
site_description: Blog o filozofiji, znanosti, religiji i društvu.
site_author: Carlo Paris i Filip Reščić

copyright: >-
  &copy; 2026 Peripatetika.
  Sadržaj je licenciran pod
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.hr" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>.

nav:
  - Početna: index.md
  - Oznake: tags.md

theme:
  name: material
  custom_dir: overrides
  language: hr  # izmjene prijevoda: overrides/partials/language.html
  font:
    text: Literata          # tijelo teksta (serif za dulje čitanje)
    code: JetBrains Mono
  favicon: images/favicon.png
  logo: images/logo.webp
  features:
    - announce.dismiss
    - content.footnote.tooltips
    - header.autohide
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tamni način rada
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Svijetli način rada

plugins:
  - search:
      lang: en
  - blog:
      blog_dir: .
      blog_toc: false
      post_url_format: "{slug}"
      post_date_format: long
      post_readtime_words_per_minute: 220
      archive_date_format: LLLL yyyy
      archive_url_date_format: MM/yyyy
      pagination_per_page: 5
  - tags
  # Društvene kartice (pregled linka na Telegramu, WhatsAppu...) trebaju
  # biblioteku Cairo. Lokalno su isključene da build radi na svakom računalu;
  # GitHub Actions ih generira (CI=true). Lokalno: CI=true mkdocs build
  - social:
      enabled: true
      cards_dir: assets/images/kartice2
      cards_layout_dir: layouts
      cards_layout: peripatetika

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes:
      BACKLINK_TITLE: "Natrag na fusnotu {} u tekstu"
  - md_in_html
  - tables
  - toc:
      permalink: false
  - material.extensions.preview
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css
  - assets/css/peripatetika.css

extra_javascript:
  - assets/javascript/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js

extra:
  # Završni blok svakog posta (overrides/partials/comments.html)
  podrska:
    url: https://buymeacoffee.com/peripatetika
    qr: images/bmc_qr.png
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/+FKR3Ycy5UqowNWY0
      name: Telegram kanal
    - icon: fontawesome/solid/envelope
      link: mailto:kontakt@peripatetika.com
      name: Pišite nam
