site_name: Peripatetika
site_url: https://peripatetika.com
site_description: Blog o filozofiji, znanosti, religiji i društvu.
theme: 
  name: material
  language: hr
  custom_dir: overrides
  font: 
    text: Ubuntu
  favicon: images/favicon.png
  logo: images/favicon.png
  features:
    - header.autohide
    - announce.dismiss
    - content.footnote.tooltips
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/lightbulb
        name: Tamni način rada
      primary: indigo
      accent: deep purple   
    # Dark mode
    - scheme: slate 
      toggle:
        icon: material/lightbulb-outline
        name: Svijetli način rada
      primary: indigo
      accent: deep purple
plugins:
  - search
  - blog:
      blog_dir: .
      archive_date_format: MM/yyyy
      archive_url_date_format: MM/yyyy
      post_url_format: "{slug}"
      pagination_per_page: 5
  - tags
  - social:
      cards_layout_dir: layouts
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - footnotes:
      BACKLINK_TITLE: "Vratite se na fusnotu {} u tekstu"
  - material.extensions.preview
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
extra_javascript:
  - assets/javascript/force-light-mode.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascript/custom.js
  - assets/javascript/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
extra_css:
  - assets/css/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/+FKR3Ycy5UqowNWY0
      name: Telegram kanal
    - icon: fontawesome/solid/envelope
      link: mailto:<kontakt@peripatetika.com>
      name: Kontaktirajte nas  
copyright: 'Copyright &copy; 2026 Peripatetika Team. Contents licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC-BY-NC-SA 4.0</a>.'
     
